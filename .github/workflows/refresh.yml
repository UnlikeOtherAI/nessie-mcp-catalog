name: Refresh public sources

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: catalog-source-refresh
  cancel-in-progress: false

permissions: {}

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm refresh
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check
      - name: Publish generated-only PR and require exact-head checks
        run: node scripts/publish-refresh.ts
        env:
          GH_TOKEN: ${{ github.token }}
